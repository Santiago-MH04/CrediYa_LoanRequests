dependencies {
    implementation project(':usecase')
    implementation project(':model')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // https://mvnrepository.com/artifact/org.mapstruct/mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    // https://mvnrepository.com/artifact/org.mapstruct/mapstruct-processor
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webflux-ui
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${openapiVersion}"
}

pitest {
    targetClasses = ['co.com.powerup.crediya.santiagomh04.msvcloanrequests.*']
    targetTests = ['co.com.powerup.crediya.santiagomh04.msvcloanrequests.*']
    excludedTestClasses = [
        'co.com.powerup.crediya.santiagomh04.msvcloanrequests.api.config.ConfigTest',
        'co.com.powerup.crediya.santiagomh04.msvcloanrequests.api.RouterRestTest'
    ]
    /*threads = 4*/
    outputFormats = ['HTML']
}



